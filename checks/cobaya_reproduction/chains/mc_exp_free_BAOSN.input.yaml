theory:
  fractal_cobaya.FractalBackground:
    python_path: .
    family: A
    kind: exp
    shape_fixed: null
likelihood:
  bao.desi_dr2.desi_bao_all: null
  fractal_cobaya.PantheonPlusPaperCut:
    python_path: .
    path: ./packages/data/sn_data
    dataset_file: PantheonPlus/config.dataset
    use_abs_mag: false
params:
  H0:
    prior:
      min: 50
      max: 90
    ref:
      dist: norm
      loc: 66
      scale: 2
    proposal: 0.5
    latex: H_E
  omegam:
    prior:
      min: 0.1
      max: 0.6
    ref:
      dist: norm
      loc: 0.31
      scale: 0.02
    proposal: 0.01
    latex: \Omega_m
  rdrag:
    latex: r_d
  omegamh2:
    latex: \omega_m
  H0_local:
    latex: H_{\rm local}
  hrdrag:
    derived: 'lambda H0: H0/100*147.09'
    latex: h r_d
  lnzc:
    prior:
      min: -3.912023005428146
      max: 1.0986122886681098
    ref:
      dist: uniform
      min: -1.5
      max: 0.0
    proposal: 0.2
    latex: \ln z_{\rm char}
  zchar:
    derived: 'lambda lnzc: np.exp(lnzc)'
    latex: z_{\rm char}
sampler:
  mcmc:
    Rminus1_stop: 0.003
    Rminus1_cl_stop: 0.2
    max_tries: 100000
    learn_proposal: true
    seed: 3
packages_path: ./packages
output: mc_exp_free_BAOSN
