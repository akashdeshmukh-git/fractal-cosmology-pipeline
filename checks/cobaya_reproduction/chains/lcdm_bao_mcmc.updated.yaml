params:
  H0:
    prior:
      min: 50
      max: 90
    ref:
      dist: norm
      loc: 66
      scale: 2
    proposal: 0.5
    latex: H_E
  omegam:
    prior:
      min: 0.1
      max: 0.6
    ref:
      dist: norm
      loc: 0.31
      scale: 0.02
    proposal: 0.01
    latex: \Omega_m
  rdrag:
    latex: r_d
    derived: true
  omegamh2:
    latex: \omega_m
    derived: true
  H0_local:
    latex: H_{\rm local}
    derived: true
  hrdrag:
    derived: 'lambda H0: H0/100*147.09'
    latex: h r_d
  chi2__BAO:
    latex: \chi^2_\mathrm{BAO}
    derived: true
sampler:
  mcmc:
    sampler_type: mcmc
    supports_periodic_params: true
    burn_in: 0
    max_tries: 100000
    covmat: null
    covmat_params: null
